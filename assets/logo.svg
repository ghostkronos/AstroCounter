<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Arka Plan Derin Uzay Gradyanı -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f1527" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Kenar Çerçeve Gradyanı -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.1" />
    </linearGradient>

    <!-- Yıldız & Çekirdek Işıma Gradyanları -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <radialGradient id="nebulaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f1527" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="starCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a6f1ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Parlama Efektleri (Filters) -->
    <filter id="glowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Ana Taşıyıcı Gövde (Squircle App Icon) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#spaceBg)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- 2. Arka Plan Nebula Parıltısı -->
  <circle cx="256" cy="256" r="190" fill="url(#nebulaCore)" />

  <!-- Arka Plan Sabit Küçük Yıldızlar (Background Stars) -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="100" cy="130" r="1.5" />
    <circle cx="140" cy="380" r="1.2" />
    <circle cx="390" cy="120" r="2" opacity="0.6" />
    <circle cx="410" cy="360" r="1.5" />
    <circle cx="210" cy="95" r="1" />
    <circle cx="320" cy="420" r="1.5" />
    <circle cx="85" cy="270" r="1.8" opacity="0.5" />
  </g>

  <!-- 3. Tespit Güven Seviyesi Yayları (Confidence Rings & Segments) -->
  <!-- Tier 1 Yay (Yüksek Güven - Cyan Kesik Çember) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 45 90 35 120 50" opacity="0.45" />

  <!-- Tier 2 Yay (Orta Güven - İnce Mor Yaylar) -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#9d4edd" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="80 180 50 110" opacity="0.3" />

  <!-- 4. Bilgisayarlı Görü / AI Bounding Box Köşebentleri (Detection Reticle) -->
  <g stroke="url(#cyanGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- Sol Üst Köşe -->
    <path d="M 170 205 L 170 170 L 205 170" fill="none" />
    <!-- Sağ Üst Köşe -->
    <path d="M 307 170 L 342 170 L 342 205" fill="none" />
    <!-- Sol Alt Köşe -->
    <path d="M 170 307 L 170 342 L 205 342" fill="none" />
    <!-- Sağ Alt Köşe -->
    <path d="M 307 342 L 342 342 L 342 307" fill="none" />
  </g>

  <!-- Hedefleme Kılavuz Çizgileri / Reticle Crosshairs (Küçük İnce Ticks) -->
  <g stroke="#00f2fe" stroke-width="2" opacity="0.6">
    <line x1="256" y1="145" x2="256" y2="158" />
    <line x1="256" y1="354" x2="256" y2="367" />
    <line x1="145" y1="256" x2="158" y2="256" />
    <line x1="354" y1="256" x2="367" y2="256" />
  </g>

  <!-- 5. Merkezdeki Parlak Obje (Astrophotography Star Core & Diffraction Spikes) -->
  <!-- Yaygın Işık Halesi -->
  <circle cx="256" cy="256" r="65" fill="url(#starCenterGlow)" filter="url(#glowFilter)" />

  <!-- 4-Nokta Kırınım Dikenleri (Diffraction Spikes - Dikey & Yatay) -->
  <path d="M 256 160 Q 256 256 160 256 Q 256 256 256 352 Q 256 256 352 256 Q 256 256 256 160 Z" fill="#ffffff" filter="url(#softGlow)" />
  <path d="M 256 185 Q 256 256 185 256 Q 256 256 256 327 Q 256 256 327 256 Q 256 256 256 185 Z" fill="#00f2fe" opacity="0.8" />

  <!-- Çapraz Mikro Dikenler (Secondary Faint Spikes) -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.75" filter="url(#softGlow)">
    <line x1="205" y1="205" x2="307" y2="307" />
    <line x1="205" y1="307" x2="307" y2="205" />
  </g>

  <!-- Parlak Beyaz Çekirdek -->
  <circle cx="256" cy="256" r="7" fill="#ffffff" />

  <!-- 6. İkincil Küçük Tespit Edilmiş Obje (Sub-detection: Faint Object / Galaxy Tag) -->
  <!-- Sağ Üst Mikro Bounding Box -->
  <g stroke="#ffb703" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M 365 145 L 365 135 L 375 135" fill="none" />
    <path d="M 395 135 L 405 135 L 405 145" fill="none" />
    <path d="M 365 165 L 365 175 L 375 175" fill="none" />
    <path d="M 395 175 L 405 175 L 405 165" fill="none" />
    <circle cx="385" cy="155" r="3" fill="#ffb703" />
  </g>
  <!-- Mini Confidence Etiketi / Noktası -->
  <text x="367" y="128" fill="#ffb703" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" opacity="0.9">0.92</text>
</svg>
