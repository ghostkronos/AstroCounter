name: Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore src/AstroCounter.slnx

    - name: Build Solution
      run: dotnet build src/AstroCounter.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test src/AstroCounter.Tests/AstroCounter.Tests.csproj --configuration Release --no-build --verbosity normal

