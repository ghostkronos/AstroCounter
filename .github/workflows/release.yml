name: Build & Release Standalone Executable

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore Dependencies
      run: dotnet restore src/AstroCounter.slnx

    - name: Publish Self-Contained Portable Package
      run: >
        dotnet publish src/AstroCounter.UI/AstroCounter.UI.csproj
        -c Release
        -r win-x64
        --self-contained true
        -o ./publish/AstroCounter-portable-win-x64

    - name: Archive Portable Release
      shell: pwsh
      run: Compress-Archive -Path ./publish/AstroCounter-portable-win-x64/* -DestinationPath ./publish/AstroCounter-portable-win-x64.zip -Force

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/AstroCounter-portable-win-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

